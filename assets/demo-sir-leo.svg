<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="sky-leo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E3B6E"/>
      <stop offset="100%" stop-color="#4A5D9E"/>
    </linearGradient>
    <pattern id="grain-leo" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="1.5" cy="1.5" r="0.7" fill="#F4EFE6" opacity="0.14"/>
      <circle cx="4.5" cy="4.5" r="0.5" fill="#2B231D" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Warm paper frame -->
  <rect width="640" height="360" rx="18" fill="#F4EFE6"/>
  <rect x="10" y="10" width="620" height="340" rx="12" fill="url(#sky-leo)" stroke="#2B231D" stroke-width="3"/>

  <!-- Stars & warm moon -->
  <circle cx="540" cy="72" r="28" fill="#F0C243" stroke="#2B231D" stroke-width="2.5"/>
  <circle cx="96" cy="64" r="3" fill="#F6F2E9"/>
  <circle cx="148" cy="48" r="2.5" fill="#F6F2E9"/>
  <circle cx="445" cy="54" r="3" fill="#F6F2E9"/>
  <circle cx="485" cy="96" r="2" fill="#F6F2E9"/>

  <!-- Rolling forest meadow -->
  <path d="M10 250 Q180 215 350 245 T630 238 L630 338 Q630 350 618 350 L22 350 Q10 350 10 338 Z" fill="#588A47" stroke="#2B231D" stroke-width="2.5"/>

  <!-- Storybook castle silhouette (left) -->
  <g transform="translate(56,162)" stroke="#2B231D" stroke-width="2.5" stroke-linejoin="round">
    <rect x="12" y="34" width="68" height="58" fill="#E3B464"/>
    <rect x="4" y="18" width="22" height="74" fill="#EED08A"/>
    <rect x="66" y="18" width="22" height="74" fill="#EED08A"/>
    <polygon points="2,18 15,0 28,18" fill="#C84B31"/>
    <polygon points="64,18 77,0 90,18" fill="#C84B31"/>
    <path d="M36 92 L36 66 Q46 54 56 66 L56 92 Z" fill="#8A5A3B"/>
    <rect x="10" y="34" width="10" height="14" rx="4" fill="#F4CA44"/>
    <rect x="72" y="34" width="10" height="14" rx="4" fill="#F4CA44"/>
  </g>

  <!-- Friendly crayon dragon silhouette (right) -->
  <g transform="translate(458,176)" stroke="#2B231D" stroke-width="2.5" stroke-linejoin="round">
    <ellipse cx="52" cy="52" rx="34" ry="26" fill="#6B9E58"/>
    <circle cx="24" cy="30" r="18" fill="#6B9E58"/>
    <path d="M64 34 L94 12 L84 44 Z" fill="#C84B31"/>
    <circle cx="18" cy="26" r="3.5" fill="#F4EFE6"/>
    <circle cx="17" cy="26" r="1.8" fill="#2B231D"/>
    <!-- Little flame puff -->
    <path d="M4 34 Q-14 26 -18 36 Q-10 42 4 38 Z" fill="#F29F4B"/>
  </g>

  <!-- Subtle paper texture -->
  <rect x="10" y="10" width="620" height="340" rx="12" fill="url(#grain-leo)"/>

  <!-- Top-left badge -->
  <rect x="26" y="26" width="218" height="30" rx="15" fill="#F4EFE6" stroke="#2B231D" stroke-width="2"/>
  <text x="135" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="bold" fill="#2B231D">CUSTOM AI VOICES DEMO</text>

  <!-- Center Play Button -->
  <circle cx="320" cy="166" r="42" fill="#F4EFE6" fill-opacity="0.95" stroke="#2B231D" stroke-width="3.5"/>
  <polygon points="309,146 344,166 309,186" fill="#C84B31" stroke="#2B231D" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Bottom title banner -->
  <rect x="28" y="274" width="584" height="58" rx="10" fill="#F4EFE6" fill-opacity="0.94" stroke="#2B231D" stroke-width="2.5"/>
  <text x="320" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#2B231D">Sir Leo &amp; the Dragon of Whispering Woods</text>
  <text x="320" y="321" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4A4238">Click to watch on Google Drive • Fully customized voices via Gemini TTS API key</text>
</svg>
