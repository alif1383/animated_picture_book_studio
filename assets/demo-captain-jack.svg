<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="sky-jack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9CCEF4"/>
      <stop offset="100%" stop-color="#F29F4B"/>
    </linearGradient>
    <pattern id="grain-jack" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="1.5" cy="1.5" r="0.7" fill="#F4EFE6" opacity="0.16"/>
      <circle cx="4.5" cy="4.5" r="0.5" fill="#2B231D" opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Warm paper frame -->
  <rect width="640" height="360" rx="18" fill="#F4EFE6"/>
  <rect x="10" y="10" width="620" height="340" rx="12" fill="url(#sky-jack)" stroke="#2B231D" stroke-width="3"/>

  <!-- Warm sun & clouds -->
  <circle cx="536" cy="78" r="30" fill="#FFCE34" stroke="#2B231D" stroke-width="2.5"/>
  <path d="M84 82 Q96 62 118 68 Q134 56 154 68 Q170 68 172 82 Z" fill="#FAF8F4" stroke="#2B231D" stroke-width="2"/>

  <!-- Ocean waves -->
  <path d="M10 232 Q70 218 130 232 T250 232 T370 232 T490 232 T630 232 L630 338 Q630 350 618 350 L22 350 Q10 350 10 338 Z" fill="#2541B2" stroke="#2B231D" stroke-width="2.5"/>
  <path d="M40 258 Q85 248 130 258 M240 264 Q290 252 340 264 M470 256 Q525 246 580 256" fill="none" stroke="#9CCEF4" stroke-width="3" stroke-linecap="round"/>

  <!-- Pirate ship silhouette (left) -->
  <g transform="translate(52,132)" stroke="#2B231D" stroke-width="2.5" stroke-linejoin="round">
    <path d="M10 74 L124 74 L108 104 L26 104 Z" fill="#4A4238"/>
    <line x1="66" y1="14" x2="66" y2="74" stroke-width="3.5"/>
    <path d="M68 20 Q102 38 68 62 Z" fill="#2B231D"/>
    <path d="M64 26 Q34 42 64 60 Z" fill="#2B231D"/>
    <polygon points="66,14 90,8 66,2" fill="#C84B31"/>
  </g>

  <!-- Speech bubble motif (right) -->
  <g transform="translate(432,144)" stroke="#2B231D" stroke-width="2.5" stroke-linejoin="round">
    <rect x="0" y="0" width="154" height="46" rx="14" fill="#FAF8F4"/>
    <polygon points="28,46 18,62 46,46" fill="#FAF8F4"/>
    <text x="77" y="29" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#2B231D">Ahoy, matey! ★</text>
  </g>

  <!-- Subtle paper texture -->
  <rect x="10" y="10" width="620" height="340" rx="12" fill="url(#grain-jack)"/>

  <!-- Top-left badge -->
  <rect x="26" y="26" width="210" height="30" rx="15" fill="#F4EFE6" stroke="#2B231D" stroke-width="2"/>
  <text x="131" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="bold" fill="#2B231D">TEXT BUBBLES ONLY DEMO</text>

  <!-- Center Play Button -->
  <circle cx="320" cy="166" r="42" fill="#F4EFE6" fill-opacity="0.95" stroke="#2B231D" stroke-width="3.5"/>
  <polygon points="309,146 344,166 309,186" fill="#C84B31" stroke="#2B231D" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Bottom title banner -->
  <rect x="28" y="274" width="584" height="58" rx="10" fill="#F4EFE6" fill-opacity="0.94" stroke="#2B231D" stroke-width="2.5"/>
  <text x="320" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#2B231D">Captain Jack &amp; The Black Pearl</text>
  <text x="320" y="321" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4A4238">Click to watch on Google Drive • Pure text/speech bubbles (no API key needed)</text>
</svg>
